<svg width="100%" viewBox="0 0 680 480" role="img"><title>코드 흐름과 기존 시스템 연결</title><desc>카메라 프레임이 전처리, CNN, 중심선 추출, 상태 추적, 조향 계산을 거쳐 토픽으로 나가고, 점선으로 기존 경로 계획기와 주행 제어기에 연결하는 제안을 나타낸다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-purple"><rect x="40" y="30" width="240" height="48" rx="8" stroke-width="0.5"/><text class="th" x="160" y="47" text-anchor="middle" dominant-baseline="central">카메라 프레임</text><text class="ts" x="160" y="65" text-anchor="middle" dominant-baseline="central">/oak/rgb/image_raw</text></g><g class="c-purple"><rect x="40" y="102" width="240" height="48" rx="8" stroke-width="0.5"/><text class="th" x="160" y="119" text-anchor="middle" dominant-baseline="central">전처리</text><text class="ts" x="160" y="137" text-anchor="middle" dominant-baseline="central">위 40% 자르고 320×120</text></g><g class="c-purple"><rect x="40" y="174" width="240" height="48" rx="8" stroke-width="0.5"/><text class="th" x="160" y="191" text-anchor="middle" dominant-baseline="central">CNN (LineNet)</text><text class="ts" x="160" y="209" text-anchor="middle" dominant-baseline="central">라인과 바닥 확률맵</text></g><g class="c-purple"><rect x="40" y="246" width="240" height="48" rx="8" stroke-width="0.5"/><text class="th" x="160" y="263" text-anchor="middle" dominant-baseline="central">중심선 추출</text><text class="ts" x="160" y="281" text-anchor="middle" dominant-baseline="central">두 라인의 가운데 곡선</text></g><g class="c-purple"><rect x="40" y="318" width="240" height="48" rx="8" stroke-width="0.5"/><text class="th" x="160" y="335" text-anchor="middle" dominant-baseline="central">상태 추적</text><text class="ts" x="160" y="353" text-anchor="middle" dominant-baseline="central">VALID에서 LOST까지</text></g><g class="c-purple"><rect x="40" y="390" width="240" height="48" rx="8" stroke-width="0.5"/><text class="th" x="160" y="407" text-anchor="middle" dominant-baseline="central">조향·속도 계산</text><text class="ts" x="160" y="425" text-anchor="middle" dominant-baseline="central">각도, 신뢰도, 정지선</text></g><line x1="160" y1="78" x2="160" y2="100" class="arr" marker-end="url(#arrow)"/><line x1="160" y1="150" x2="160" y2="172" class="arr" marker-end="url(#arrow)"/><line x1="160" y1="222" x2="160" y2="244" class="arr" marker-end="url(#arrow)"/><line x1="160" y1="294" x2="160" y2="316" class="arr" marker-end="url(#arrow)"/><line x1="160" y1="366" x2="160" y2="388" class="arr" marker-end="url(#arrow)"/><g class="c-gray"><rect x="400" y="150" width="240" height="48" rx="8" stroke-width="0.5"/><text class="th" x="520" y="167" text-anchor="middle" dominant-baseline="central">① 경로 계획기</text><text class="ts" x="520" y="185" text-anchor="middle" dominant-baseline="central">LiDAR 스캔으로 계획</text></g><g class="c-gray"><rect x="400" y="234" width="240" height="48" rx="8" stroke-width="0.5"/><text class="th" x="520" y="251" text-anchor="middle" dominant-baseline="central">② 주행 제어기</text><text class="ts" x="520" y="269" text-anchor="middle" dominant-baseline="central">50 Hz 경로 실행</text></g><g class="c-gray"><rect x="400" y="318" width="240" height="48" rx="8" stroke-width="0.5"/><text class="th" x="520" y="335" text-anchor="middle" dominant-baseline="central">③ 안전 게이트</text><text class="ts" x="520" y="353" text-anchor="middle" dominant-baseline="central">AEB와 최종 승인</text></g><g class="c-gray"><rect x="400" y="402" width="240" height="48" rx="8" stroke-width="0.5"/><text class="th" x="520" y="419" text-anchor="middle" dominant-baseline="central">VESC · 서보</text><text class="ts" x="520" y="437" text-anchor="middle" dominant-baseline="central">실제 구동</text></g><line x1="520" y1="198" x2="520" y2="220" class="arr" marker-end="url(#arrow)"/><line x1="520" y1="282" x2="520" y2="304" class="arr" marker-end="url(#arrow)"/><line x1="520" y1="366" x2="520" y2="388" class="arr" marker-end="url(#arrow)"/><path d="M280 414 L340 414 L340 174 L398 174" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M340 258 L398 258" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="40" y1="462" x2="70" y2="462" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4"/><text class="ts" x="78" y="462" text-anchor="start" dominant-baseline="central">점선: /line_cnn 토픽을 쓰는 제안 연결 (아직 적용 안 됨)</text></svg>